name: Tony's Painting & Remodeling Suite - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify Enterprise Suite
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      TZ: "America/New_York"
      AUTH_SECRET: "ci_cd_github_actions_secret_key_tonys_2026"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Nuxt Production Build
        run: npm run build
